name: Weekly database backup

on:
  schedule:
    # Sundays at 01:00 UTC (04:00 in Addis Ababa)
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt and store the database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump the public schema
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          pg_dump "$BACKUP_DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=nexum.dump
          # Fails the job if the dump cannot be read back.
          pg_restore --list nexum.dump > /dev/null
          ls -lh nexum.dump

      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "nexum-$(date -u +%F).dump.gpg" nexum.dump
          shred -u nexum.dump
          ls -lh nexum-*.dump.gpg

      - name: Keep it for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: nexum-database-backup
          path: nexum-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
          